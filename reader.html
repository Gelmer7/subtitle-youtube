<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>SubIngles — Modo leitura</title>
    <link rel="icon" href="icons/icon48.png" />
    <link rel="stylesheet" href="reader.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="video-heading">
          <h1 id="videoTitle">A ligar ao vídeo…</h1>
          <p id="videoMeta" class="video-meta"></p>
        </div>

        <div class="controlbar">
          <div class="control-group transport">
            <button id="playButton" class="tool-button play-button" type="button" aria-label="Reproduzir" title="Reproduzir">
              <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M8 5.1v13.8L19.2 12Z" />
              </svg>
              <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M9.5 5.5v13M14.5 5.5v13" stroke-width="2.2" />
              </svg>
            </button>
            <span id="timeDisplay" class="time-display">
              <span id="timeCurrent">00:00</span>
              <span class="time-sep" aria-hidden="true">/</span>
              <span id="timeTotal" class="time-total">00:00</span>
            </span>
          </div>

          <div class="control-group navigation" role="group" aria-label="Navegação e velocidade">
            <button id="prevLineButton" class="tool-button" type="button" aria-label="Linha anterior (seta acima)" title="Linha anterior (↑)">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 18.5V6M6.5 11.5 12 6l5.5 5.5" />
              </svg>
            </button>
            <button id="nextLineButton" class="tool-button" type="button" aria-label="Linha seguinte (seta abaixo)" title="Linha seguinte (↓)">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 5.5V18M6.5 12.5 12 18l5.5-5.5" />
              </svg>
            </button>
            <label class="select-wrap">
              <span class="sr-only">Velocidade</span>
              <select id="rateSelect" aria-label="Velocidade de reprodução">
                <option value="0.75">0,75×</option>
                <option value="1" selected>1×</option>
                <option value="1.25">1,25×</option>
                <option value="1.5">1,5×</option>
              </select>
            </label>
            <button id="muteButton" class="tool-button" type="button" aria-label="Silenciar" title="Silenciar">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" />
                <path class="sound-wave" d="M16 9a5 5 0 0 1 0 6" />
                <path class="sound-wave" d="M19.364 18.364a9 9 0 0 0 0-12.728" />
                <path class="sound-muted" d="m22 9-6 6" />
                <path class="sound-muted" d="m16 9 6 6" />
              </svg>
            </button>
          </div>

          <div class="control-group preferences" role="group" aria-label="Preferências de leitura">
            <button
              id="showTranslation"
              class="tool-button"
              type="button"
              aria-pressed="true"
              aria-label="Tradução"
              title="Mostrar ou ocultar a tradução"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M4 5h10M9 3v2c0 4.6-2.3 8-6 10M5.5 9.5c1.8 3.2 4.5 5.6 8.1 7.2M14 20l4.2-10L22 20M15.7 16.5h5.1" />
              </svg>
            </button>
            <button
              id="pauseOnLookup"
              class="tool-button"
              type="button"
              aria-pressed="false"
              aria-label="Pausar ao traduzir"
              title="Pausar o áudio ao abrir a tradução de uma palavra"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="9" />
                <path d="M10 9v6M14 9v6" />
              </svg>
            </button>
            <button
              id="followAudio"
              class="tool-button"
              type="button"
              aria-pressed="true"
              aria-label="Seguir áudio"
              title="Acompanhar automaticamente a linha que está a ser falada"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3" />
              </svg>
            </button>
            <button
              id="loopLine"
              class="tool-button"
              type="button"
              aria-pressed="false"
              aria-label="Repetir linha"
              title="Repetir a linha ativa até desligar ou saltar com ↑/↓"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="m17 2 4 4-4 4" />
                <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
                <path d="m7 22-4-4 4-4" />
                <path d="M21 13v1a4 4 0 0 1-4 4H3" />
                <path d="M11 10h1v4" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div id="statusBar" class="status-bar" role="status" hidden></div>

      <main id="scrollArea" class="transcript-scroll">
        <div class="transcript-wrap">
          <section id="emptyState" class="empty-state">
            <div class="empty-mark" aria-hidden="true">Aa</div>
            <h2>A preparar a transcrição</h2>
            <p id="emptyText">Aguarda enquanto as legendas do vídeo são carregadas.</p>
            <button id="retryButton" class="primary-button" type="button">
              Tentar novamente
            </button>
          </section>

          <section id="transcript" class="transcript" aria-label="Transcrição do vídeo"></section>
          <div class="bottom-spacer" aria-hidden="true"></div>
        </div>
      </main>
    </div>

    <div id="wordPopover" class="word-popover" role="dialog" aria-label="Tradução da palavra" hidden>
      <div class="popover-head">
        <strong id="popWord"></strong>
        <button id="popClose" class="pop-close" type="button" aria-label="Fechar tradução">×</button>
      </div>
      <p id="popTranslation" class="pop-translation" aria-live="polite">A traduzir…</p>
      <p id="popContext" class="pop-context"></p>
      <div class="pop-actions">
        <button id="popRepeat" class="small-button" type="button">Repetir frase</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="reader.js"></script>
  </body>
</html>

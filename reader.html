<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>SubIngles — Modo leitura</title>
    <link rel="icon" href="icons/icon48.png" />
    <link rel="stylesheet" href="reader.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="video-heading">
          <h1 id="videoTitle">A ligar ao vídeo…</h1>
          <p id="videoMeta" class="video-meta"></p>
        </div>

        <div class="controlbar">
          <div class="control-group transport">
            <span id="timeDisplay" class="time-display">
              <span id="timeCurrent">00:00</span>
              <span class="time-sep" aria-hidden="true">/</span>
              <span id="timeTotal" class="time-total">00:00</span>
            </span>
          </div>

          <div class="control-group navigation" role="group" aria-label="Velocidade de reprodução">
            <label class="select-wrap">
              <span class="sr-only">Velocidade</span>
              <select id="rateSelect" aria-label="Velocidade de reprodução">
                <option value="0.75">0,75×</option>
                <option value="1" selected>1×</option>
                <option value="1.25">1,25×</option>
                <option value="1.5">1,5×</option>
              </select>
            </label>
          </div>

          <div class="control-group preferences" role="group" aria-label="Preferências de leitura">
            <button
              id="followAudio"
              class="tool-button"
              type="button"
              aria-pressed="true"
              aria-label="Seguir áudio"
              title="Acompanhar automaticamente a linha que está a ser falada"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div id="statusBar" class="status-bar" role="status" hidden></div>

      <main id="scrollArea" class="transcript-scroll">
        <div class="transcript-wrap">
          <section id="emptyState" class="empty-state">
            <div class="empty-mark" aria-hidden="true">Aa</div>
            <h2>A preparar a transcrição</h2>
            <p id="emptyText">Aguarda enquanto as legendas do vídeo são carregadas.</p>
            <button id="retryButton" class="primary-button" type="button">
              Tentar novamente
            </button>
          </section>

          <section id="transcript" class="transcript" aria-label="Transcrição do vídeo"></section>
          <div class="bottom-spacer" aria-hidden="true"></div>
        </div>
      </main>
    </div>

    <div id="wordPopover" class="word-popover" role="dialog" aria-label="Tradução da palavra" hidden>
      <div class="popover-head">
        <strong id="popWord"></strong>
        <button id="popClose" class="pop-close" type="button" aria-label="Fechar tradução">×</button>
      </div>
      <p id="popTranslation" class="pop-translation" aria-live="polite">A traduzir…</p>
      <p id="popContext" class="pop-context"></p>
      <div class="pop-actions">
        <button id="popRepeat" class="small-button" type="button">Repetir frase</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="reader.js"></script>
  </body>
</html>
